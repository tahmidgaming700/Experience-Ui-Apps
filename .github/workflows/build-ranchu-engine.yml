name: Build Android Ranchu QEMU for ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - feat/experience-virtual-os-rootless
    paths:
      - ".github/workflows/build-ranchu-engine.yml"
      - "apps/experience-virtual-os/**"

permissions:
  contents: read

# Keep one source build active. Do not cancel a multi-hour Android source sync
# just because another commit is pushed; GitHub queues the next run instead.
concurrency:
  group: experience-virtual-os-ranchu-arm64
  cancel-in-progress: false

jobs:
  build-ranchu:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      REPO_SYNC_JOBS: "4"
    steps:
      - name: Check out Experience Virtual OS source
        uses: actions/checkout@v4
        with:
          ref: feat/experience-virtual-os-rootless
          fetch-depth: 1

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Install Android emulator build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 python3-pip python-is-python3 \
            build-essential crossbuild-essential-arm64 cmake ninja-build pkg-config \
            zip unzip rsync bc bison flex libncurses5-dev libssl-dev file binutils

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" version

      - name: Fetch Android Emulator source
        timeout-minutes: 300
        run: |
          set -euo pipefail
          mkdir -p android-emulator
          cd android-emulator
          repo init \
            -u https://android.googlesource.com/platform/manifest \
            -b emu-master-dev \
            --depth=1 \
            --no-clone-bundle
          # Use a conservative parallelism level and repo's own fetch retries.
          # Keep full output so a failed project is visible in the Actions log.
          repo sync \
            --current-branch \
            --jobs="$REPO_SYNC_JOBS" \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --retry-fetches=5 \
            --fail-fast
          echo "Android Emulator source sync completed."
          df -h
          du -sh .

      - name: Install Python build dependencies
        run: python3 -m pip install --break-system-packages --retries 5 absl-py urlfetch

      - name: Cross-compile Google Android Emulator for Linux ARM64
        working-directory: android-emulator/external/qemu
        timeout-minutes: 300
        run: |
          set -euo pipefail
          python3 android/build/python/cmake.py \
            --noqtwebengine \
            --noshowprefixforinfo \
            --target linux_aarch64

      - name: Package Ranchu QEMU runtime
        run: |
          set -euo pipefail
          BIN="$(find android-emulator/external/qemu -type f -path '*/qemu/linux-aarch64/qemu-system-aarch64' -print -quit)"
          if [ -z "$BIN" ]; then
            BIN="$(find android-emulator -type f -name qemu-system-aarch64 -print -quit)"
          fi
          test -n "$BIN"
          DIST="$(dirname "$(dirname "$(dirname "$BIN")")")"
          test -d "$DIST/qemu"
          mkdir -p "$RUNNER_TEMP/ranchu-runtime"
          cp -a "$DIST/." "$RUNNER_TEMP/ranchu-runtime/"
          test -f "$RUNNER_TEMP/ranchu-runtime/emulator"
          test -f "$RUNNER_TEMP/ranchu-runtime/qemu/linux-aarch64/qemu-system-aarch64"
          test -f "$RUNNER_TEMP/ranchu-runtime/qemu/linux-aarch64/qemu-system-aarch64-headless"
          file "$RUNNER_TEMP/ranchu-runtime/emulator"
          file "$RUNNER_TEMP/ranchu-runtime/qemu/linux-aarch64/qemu-system-aarch64"
          readelf -h "$RUNNER_TEMP/ranchu-runtime/qemu/linux-aarch64/qemu-system-aarch64" | grep -E "Machine:.*AArch64"
          tar -C "$RUNNER_TEMP/ranchu-runtime" -czf "$RUNNER_TEMP/experience-ranchu-qemu-arm64.tar.gz" .
          (cd "$RUNNER_TEMP" && sha256sum experience-ranchu-qemu-arm64.tar.gz > experience-ranchu-qemu-arm64.tar.gz.sha256)
          ls -lh "$RUNNER_TEMP/experience-ranchu-qemu-arm64.tar.gz"

      - name: Upload Android Ranchu QEMU runtime
        uses: actions/upload-artifact@v4
        with:
          name: experience-ranchu-qemu-arm64
          path: |
            ${{ runner.temp }}/experience-ranchu-qemu-arm64.tar.gz
            ${{ runner.temp }}/experience-ranchu-qemu-arm64.tar.gz.sha256
          retention-days: 30

      - name: Set up JDK 17 for Experience Virtual OS
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android app build SDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bundle Ranchu engine into Experience Virtual OS
        run: |
          mkdir -p apps/experience-virtual-os/app/src/main/assets
          cp "$RUNNER_TEMP/experience-ranchu-qemu-arm64.tar.gz" \
            apps/experience-virtual-os/app/src/main/assets/ranchu-engine.tar.gz

      - name: Build Experience Virtual OS with official Ranchu engine
        working-directory: apps/experience-virtual-os
        run: gradle --no-daemon assembleDebug

      - name: Upload Experience Virtual OS Ranchu APK
        uses: actions/upload-artifact@v4
        with:
          name: experience-virtual-os-ranchu-debug
          path: apps/experience-virtual-os/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
