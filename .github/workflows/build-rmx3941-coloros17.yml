name: Build RMX3941 ColorOS 17 port

# Manual only: runs rom/rmx3941-coloros17/port.sh on a GitHub runner and
# publishes the result as a DRAFT pre-release, split into parts under
# GitHub's 2 GiB asset limit. Nothing is public until someone reviews the
# draft and publishes it by hand.
#
# The output contains OPPO/realme firmware. Check that redistributing it is
# acceptable for this repository before publishing the draft.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Draft release tag (e.g. rmx3941-coloros17-v1). Empty = build only, keep as a workflow artifact list."
        required: false
        default: ""
      donor_url:
        description: "Override the donor ColorOS 17 OTA URL (empty = value in config.env)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: rmx3941-coloros17
  cancel-in-progress: false

jobs:
  port:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write   # draft release only
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af > /dev/null || true
          df -h /

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libssl-dev zlib1g-dev libfmt-dev \
            erofs-utils android-sdk-libsparse-utils zstd

      - name: Build the port
        env:
          DONOR_URL: ${{ github.event.inputs.donor_url }}
        run: |
          [ -n "$DONOR_URL" ] || unset DONOR_URL
          sudo -E env "PATH=$PATH" bash rom/rmx3941-coloros17/port.sh "$RUNNER_TEMP/work" "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/port.log"
          exit ${PIPESTATUS[0]}

      - name: Package
        run: |
          sudo rm -rf "$RUNNER_TEMP/work"
          mkdir -p dist
          cp rom/rmx3941-coloros17/README.md "$RUNNER_TEMP/out/README.md"
          cp "$RUNNER_TEMP/port.log" "$RUNNER_TEMP/out/port.log"
          NAME=RMX3941-ColorOS17-port
          sudo tar -C "$RUNNER_TEMP/out" -cf - . | zstd -T0 -6 --long=27 \
            | split -b 1900M -d -a 2 - "dist/$NAME.tar.zst.part"
          sudo rm -rf "$RUNNER_TEMP/out"
          (cd dist && sha256sum $NAME.tar.zst.part* > SHA256SUMS)
          cp "$RUNNER_TEMP/port.log" dist/port.log
          ls -la dist

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: port-log
          path: |
            dist/port.log
            dist/SHA256SUMS

      - name: Publish draft pre-release
        if: github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          name: RMX3941 ColorOS 17 port (untested) ${{ github.event.inputs.release_tag }}
          tag_name: ${{ github.event.inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body: |
            **Untested on hardware.** ColorOS 17 (community Find X3 build) on the realme C75 (RMX3941) vendor.
            Unlocked bootloader required; flashing wipes the phone. Read README.md inside the archive first.

            Reassemble and unpack:
            ```
            sha256sum -c SHA256SUMS
            cat RMX3941-ColorOS17-port.tar.zst.part* | zstd -d --long=27 | tar -xf - -C RMX3941-ColorOS17
            ```
          fail_on_unmatched_files: true
          files: |
            dist/RMX3941-ColorOS17-port.tar.zst.part*
            dist/SHA256SUMS
            dist/port.log
