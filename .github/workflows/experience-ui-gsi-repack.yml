name: Experience UI GSI (prebuilt base + Experience apps)

# Adds Experience UI to a prebuilt LineageOS 18.1 GSI instead of compiling Android:
# builds the 14 apps, signs them with the AOSP test platform key (the key the base
# image is signed with; checked before anything is changed), builds the overlays,
# repacks the system image with scripts/gsi/repack.sh and runs the static image checks.
#
# Fits on a GitHub-hosted runner (works on /mnt, ~10 GB). The image is uploaded as a
# workflow artifact. With "publish" it also becomes a DRAFT PRE-RELEASE; it is never
# published as stable, because no boot test exists.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base GSI (.img.xz)"
        default: "https://downloads.sourceforge.net/project/andyyan-gsi/lineage-18.x/lineage-18.1-20240121-UNOFFICIAL-arm64_bgS.img.xz"
      base_sha256:
        description: "SHA-256 of the base .img.xz"
        default: "7bb7c4ebd336ad1615ce9f078d6a455e2c524d736578571ac41671b36d23415a"
      edition:
        description: "GApps for arm64_bgS/bgN bases, Vanilla for bvS/bvN"
        default: "GApps"
      publish:
        description: "Publish a GitHub pre-release with the image and flashable zip"
        type: boolean
        default: false
      tag:
        description: "Release tag (when publishing)"
        default: "experience-ui-1.0.0"
  push:
    paths:
      - "scripts/gsi/**"
      - ".github/workflows/experience-ui-gsi-repack.yml"

permissions:
  contents: read

concurrency:
  group: experience-gsi-repack-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: ${{ inputs.base_url || 'https://downloads.sourceforge.net/project/andyyan-gsi/lineage-18.x/lineage-18.1-20240121-UNOFFICIAL-arm64_bgS.img.xz' }}
  BASE_SHA256: ${{ inputs.base_sha256 || '7bb7c4ebd336ad1615ce9f078d6a455e2c524d736578571ac41671b36d23415a' }}
  EXPERIENCE_EDITION: ${{ inputs.edition || 'GApps' }}
  EXPERIENCE_BASE_LABEL: "LineageOS 18.1 arm64_bgS 20240121 (AndyYan) + TrebleDroid (Android 11)"
  WORK: /mnt/experience-gsi

jobs:
  repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      build_id: ${{ steps.id.outputs.build_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Build ID and workspace
        id: id
        run: |
          echo "build_id=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          sudo mkdir -p "$WORK" && sudo chown "$(id -u):$(id -g)" "$WORK"
          df -h / /mnt

      - name: Tools
        run: sudo apt-get install -y -qq e2fsprogs xz-utils > /dev/null

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-30" "build-tools;35.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > apps/experience-suite/local.properties

      - name: Build Experience apps (release)
        working-directory: apps/experience-suite
        run: ./gradlew --no-daemon --console=plain assembleRelease

      - name: Download and verify base GSI
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 10 -o "$WORK/base.img.xz" "$BASE_URL"
          echo "$BASE_SHA256  $WORK/base.img.xz" | sha256sum -c -

      - name: Repack with Experience UI and verify
        env:
          EXPERIENCE_BUILD_ID: ${{ steps.id.outputs.build_id }}
          EXPERIENCE_SKIP_GRADLE: "1"
        run: bash scripts/gsi/repack.sh "$WORK/base.img.xz" "$WORK/out"

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: experience-ui-gsi-${{ steps.id.outputs.build_id }}
          path: /mnt/experience-gsi/out/release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Build AOSP test-key-signed flashable zip
        env:
          BT_GLOB: "/usr/local/lib/android/sdk/build-tools/*"
        run: |
          set -euo pipefail
          sec="https://raw.githubusercontent.com/LineageOS/android_build/lineage-18.1/target/product/security"
          mkdir -p "$WORK/keys"
          curl -fsSL "$sec/testkey.pk8" -o "$WORK/keys/testkey.pk8"
          curl -fsSL "$sec/testkey.x509.pem" -o "$WORK/keys/testkey.x509.pem"
          openssl pkcs8 -inform DER -in "$WORK/keys/testkey.pk8" -out "$WORK/keys/testkey.key" -nocrypt
          openssl pkcs12 -export -in "$WORK/keys/testkey.x509.pem" -inkey "$WORK/keys/testkey.key" \
            -name testkey -out "$WORK/keys/testkey.p12" -passout pass:android
          name="ExperienceUI-1.0.0-${{ steps.id.outputs.build_id }}-arm64_bgS"
          python3 -I scripts/gsi/make-flashable-zip.py --image "$WORK/out/image/system.img" \
            --out "$WORK/out/flashable" --name "$name" \
            --keystore "$WORK/keys/testkey.p12" --storepass android --alias testkey \
            --manifest "$WORK/out/image/repack-manifest.json"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: experience-ui-flashable-zip-${{ steps.id.outputs.build_id }}
          path: |
            /mnt/experience-gsi/out/flashable/*.zip
            /mnt/experience-gsi/out/flashable/*.sha256
            /mnt/experience-gsi/out/flashable/*.info.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 30


      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience-ui-gsi-report-${{ steps.id.outputs.build_id }}
          path: |
            /mnt/experience-gsi/out/image/verification.json
            /mnt/experience-gsi/out/image/repack-manifest.json
          if-no-files-found: ignore

  release:
    needs: repack
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: experience-ui-gsi-${{ needs.repack.outputs.build_id }}
          path: dl/image

      - name: Download flashable zip artifact
        uses: actions/download-artifact@v4
        with:
          name: experience-ui-flashable-zip-${{ needs.repack.outputs.build_id }}
          path: dl/zip

      - name: Assemble assets and release notes
        run: |
          set -euo pipefail
          mkdir -p assets
          find dl -type f \( -name '*.img.xz' -o -name '*.zip' -o -name 'repack-manifest.json' \
                 -o -name 'verification.json' -o -name '*.sha256' \) -exec cp -n {} assets/ \;
          test -n "$(find assets -name '*.img.xz')" || { echo '::error::no image'; exit 1; }
          test -n "$(find assets -name '*.zip')"    || { echo '::error::no flashable zip'; exit 1; }
          ( cd assets && rm -f SHA256SUMS && sha256sum ./*.img.xz ./*.zip | sed 's# \./# #' > SHA256SUMS )
          python3 - <<'PY'
          import glob, json
          notes = open("docs/releases/experience-ui-1.0.0.md").read().rstrip() + "\n\n## This build\n\n"
          man = next((json.load(open(p)) for p in glob.glob("assets/repack-manifest.json")), {})
          if man:
              notes += f"- Build number: `{man.get('build_number','')}`\n"
              notes += f"- Base image: `{man.get('base_image','')}` (SHA-256 `{man.get('base_image_sha256','')}`)\n"
              notes += f"- Platform certificate: `{man.get('platform_certificate_sha256','')[:24]}...` (AOSP test key)\n"
              notes += f"- Apps installed: {len(man.get('installed_apps',{}))}; overlays: {len(man.get('overlays',[]))}\n"
          ver = next((json.load(open(p)) for p in glob.glob("assets/verification.json")), {})
          if ver:
              ok = sum(1 for c in ver.get("checks", []) if c["ok"])
              notes += f"- Static image checks: {ok}/{len(ver.get('checks', []))} passed - **not a boot test**\n"
          notes += "\n### Checksums\n\n```\n" + open("assets/SHA256SUMS").read().strip() + "\n```\n"
          notes += ("\n---\n\U0001F916 Generated with [Claude Code](https://claude.com/claude-code)\n\n"
                    "https://claude.ai/code/session_01686Rfxjgen1Dx6B3SmgmM5\n")
          open("release-notes.md", "w").write(notes)
          PY
          ls -la assets

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release $tag already exists; choose another tag or delete it"
            exit 1
          fi
          gh release create "$tag" assets/* \
            --prerelease \
            --title "Experience UI 1.0 (Android 11 GSI) - pre-release" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
          echo "Published: $(gh release view "$tag" --json url --jq .url)"
