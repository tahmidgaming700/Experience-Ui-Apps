name: Build Experience Virtual OS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/experience-virtual-os-rootless
    tags:
      - "v*"
    paths:
      - "apps/experience-virtual-os/**"
      - ".github/workflows/build-experience-virtual-os.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          "${ANDROID_HOME}/platform-tools/adb" version

      - name: Fetch and verify Alpine ARM64 minirootfs
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import re
          import urllib.request

          base = "https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/aarch64"
          request = urllib.request.Request(base + "/", headers={"User-Agent": "Experience-Virtual-OS-CI"})
          with urllib.request.urlopen(request, timeout=30) as response:
              index = response.read().decode("utf-8", "replace")
          matches = re.findall(r"alpine-minirootfs-([0-9]+(?:\.[0-9]+){2})-aarch64\.tar\.gz", index)
          if not matches:
              raise SystemExit("Could not locate the official Alpine ARM64 minirootfs archive")
          version = max(matches, key=lambda value: tuple(int(part) for part in value.split(".")))
          filename = f"alpine-minirootfs-{version}-aarch64.tar.gz"
          with urllib.request.urlopen(base + "/" + filename, timeout=60) as response:
              archive = response.read()
          with urllib.request.urlopen(base + "/" + filename + ".sha256", timeout=30) as response:
              checksum_text = response.read().decode("utf-8", "replace")
          expected = checksum_text.split()[0].lower()
          if not expected:
              raise SystemExit("Alpine checksum file was empty for " + filename)
          actual = hashlib.sha256(archive).hexdigest()
          if actual != expected:
              raise SystemExit("Alpine minirootfs checksum mismatch")
          destination = pathlib.Path("apps/experience-virtual-os/app/src/main/assets/alpine/alpine-minirootfs.tar.gz")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(archive)
          print(f"Verified Alpine {version} ARM64 minirootfs: {len(archive)} bytes")
          PY

      - name: Prepare release signing key
        id: signing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; no installable release will be published."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/experience-virtual-os-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: apps/experience-virtual-os
        run: gradle --no-daemon assembleDebug

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.ready == 'true'
        working-directory: apps/experience-virtual-os
        run: gradle --no-daemon assembleRelease

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Experience Virtual OS ${{ github.ref_name }}
          generate_release_notes: true
          files: apps/experience-virtual-os/app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: experience-virtual-os-debug
          path: apps/experience-virtual-os/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
