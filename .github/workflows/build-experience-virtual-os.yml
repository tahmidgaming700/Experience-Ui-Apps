name: Build Experience Virtual OS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/experience-virtual-os-rootless
    paths:
      - "apps/experience-virtual-os/**"
      - ".github/workflows/build-experience-virtual-os.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: apps/experience-virtual-os
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: experience-virtual-os-debug
          path: apps/experience-virtual-os/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
