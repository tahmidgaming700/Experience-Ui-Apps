name: Build Experience Virtual OS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/experience-virtual-os-rootless
    tags:
      - "v*"
    paths:
      - "apps/experience-virtual-os/**"
      - ".github/workflows/build-experience-virtual-os.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          "${ANDROID_HOME}/platform-tools/adb" version

      - name: Fetch and verify Alpine ARM64 minirootfs
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import re
          import urllib.request

          base = "https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/aarch64"
          request = urllib.request.Request(base + "/", headers={"User-Agent": "Experience-Virtual-OS-CI"})
          with urllib.request.urlopen(request, timeout=30) as response:
              index = response.read().decode("utf-8", "replace")
          matches = re.findall(r'href="(alpine-minirootfs-([0-9.]+)-aarch64\.tar\.gz)"', index)
          if not matches:
              raise SystemExit("Could not locate the official Alpine ARM64 minirootfs archive")
          filename, version = max(matches, key=lambda item: tuple(int(part) for part in item[1].split(".")))
          with urllib.request.urlopen(base + "/" + filename, timeout=60) as response:
              archive = response.read()
          with urllib.request.urlopen(base + "/SHA256SUMS", timeout=30) as response:
              sums = response.read().decode("utf-8", "replace")
          expected = None
          for line in sums.splitlines():
              fields = line.split()
              if len(fields) >= 2 and fields[-1].lstrip("*") == filename:
                  expected = fields[0].lower()
                  break
          if not expected:
              raise SystemExit("Alpine SHA256SUMS did not contain " + filename)
          actual = hashlib.sha256(archive).hexdigest()
          if actual != expected:
              raise SystemExit("Alpine minirootfs checksum mismatch")
          destination = pathlib.Path("apps/experience-virtual-os/app/src/main/assets/alpine/alpine-minirootfs.tar.gz")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(archive)
          print(f"Verified Alpine {version} ARM64 minirootfs: {len(archive)} bytes")
          PY

      - name: Build debug APK
        working-directory: apps/experience-virtual-os
        run: gradle --no-daemon assembleDebug

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Experience Virtual OS ${{ github.ref_name }}
          generate_release_notes: true
          files: apps/experience-virtual-os/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: experience-virtual-os-debug
          path: apps/experience-virtual-os/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
