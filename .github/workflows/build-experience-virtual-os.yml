name: Build Experience Virtual OS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/experience-virtual-os-rootless
    paths:
      - "apps/experience-virtual-os/**"
      - ".github/workflows/build-experience-virtual-os.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          "${ANDROID_HOME}/platform-tools/adb" version

      - name: Build debug APK
        working-directory: apps/experience-virtual-os
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: experience-virtual-os-debug
          path: apps/experience-virtual-os/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
